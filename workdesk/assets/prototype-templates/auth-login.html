<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkDesk Auth Login Template</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.8.0/dist/index.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.8.0/dist/index.full.js"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <style>
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; }
    .brand-panel { background: linear-gradient(150deg, #00689E 0%, #075985 100%); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100 p-6">
  <div id="app" class="w-full max-w-5xl">
    <section class="bg-white rounded-2xl shadow-xl overflow-hidden grid lg:grid-cols-2 border border-gray-200">
      <aside class="brand-panel hidden lg:flex text-white p-10 flex-col justify-between min-h-[560px]">
        <div>
          <div class="text-sm text-white/70 mb-4">后台管理系统</div>
          <h1 class="text-3xl font-bold tracking-tight">统一管理入口</h1>
          <p class="mt-3 text-white/75 leading-6">登录页只负责授权，不放后台导航、列表或业务操作。</p>
        </div>
        <div class="space-y-4">
          <div v-for="item in bullets" :key="item" class="flex items-center gap-3 text-sm">
            <span class="w-7 h-7 rounded-full bg-white/15 flex items-center justify-center"><el-icon><Check /></el-icon></span>
            <span>{{ item }}</span>
          </div>
        </div>
      </aside>

      <main class="p-8 sm:p-10 flex flex-col justify-center">
        <div class="mb-8">
          <div class="w-12 h-12 rounded-xl bg-[#00689E] text-white flex items-center justify-center mb-5">
            <el-icon size="24"><Lock /></el-icon>
          </div>
          <h2 class="text-2xl sm:text-3xl font-bold text-gray-900">后台登录</h2>
          <p class="text-sm text-gray-500 mt-2">请使用已分配的后台账号登录。</p>
        </div>

        <el-form ref="formRef" :model="form" label-position="top" size="large" class="space-y-2">
          <el-form-item label="租户 / 群组代码" prop="tenant" :rules="[{ required: true, message: '请输入租户代码', trigger: 'blur' }]">
            <el-input v-model="form.tenant" placeholder="请输入租户或群组代码">
              <template #prefix><el-icon><OfficeBuilding /></el-icon></template>
            </el-input>
          </el-form-item>
          <el-form-item label="账号" prop="account" :rules="[{ required: true, message: '请输入账号', trigger: 'blur' }]">
            <el-input v-model="form.account" placeholder="邮箱 / 手机号 / 工号">
              <template #prefix><el-icon><User /></el-icon></template>
            </el-input>
          </el-form-item>
          <el-form-item label="密码" prop="password" :rules="[{ required: true, message: '请输入密码', trigger: 'blur' }]">
            <el-input v-model="form.password" type="password" show-password placeholder="请输入密码" autocomplete="current-password">
              <template #prefix><el-icon><Key /></el-icon></template>
            </el-input>
          </el-form-item>
          <div class="grid grid-cols-[1fr_140px] gap-3">
            <el-form-item label="验证码" prop="captcha" :rules="[{ required: true, message: '请输入验证码', trigger: 'blur' }]">
              <el-input v-model="form.captcha" placeholder="请输入右侧验证码" />
            </el-form-item>
            <button type="button" class="mt-[30px] h-10 rounded-lg border border-gray-200 bg-gray-50 text-xs text-gray-500 hover:border-[#00689E]" @click="refreshCaptcha">
              {{ captchaText }}
            </button>
          </div>
          <div class="flex items-center justify-between text-sm mb-4">
            <el-checkbox v-model="form.remember">记住我</el-checkbox>
            <el-button link type="primary">忘记密码</el-button>
          </div>
          <el-button type="primary" color="#00689E" class="w-full !h-11" :loading="loading" @click="login">登录</el-button>
        </el-form>

        <p class="text-xs text-gray-400 mt-8">没有后台账号时，联系管理员开通。</p>
      </main>
    </section>
  </div>

  <script>
    const { createApp, reactive, ref } = Vue;
    const app = createApp({
      setup() {
        const form = reactive({ tenant: '', account: '', password: '', captcha: '', remember: true });
        const loading = ref(false);
        const captchaText = ref('点击获取验证码');
        const bullets = ['租户隔离', '权限控制', '安全审计'];
        const refreshCaptcha = () => { captchaText.value = '验证码占位'; };
        const login = () => {
          loading.value = true;
          setTimeout(() => {
            loading.value = false;
            ElementPlus.ElMessage.success('登录成功，进入后台');
          }, 500);
        };
        return { form, loading, captchaText, bullets, refreshCaptcha, login };
      }
    });
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) app.component(key, component);
    app.use(ElementPlus).mount('#app');
  </script>
</body>
</html>
