<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkDesk Modal Form Template</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.8.0/dist/index.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.8.0/dist/index.full.js"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <style>
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; }
    .brand-bg { background: #00689E; }
    .panel { border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgb(15 23 42 / 0.05); }
  </style>
</head>
<body>
  <div id="app" class="h-screen flex overflow-hidden">
    <aside class="w-64 shrink-0 brand-bg text-white flex flex-col">
      <div class="h-16 px-5 flex items-center border-b border-white/10 font-semibold">弹窗表单母版</div>
      <nav class="flex-1 px-3 py-5 text-sm space-y-1">
        <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-white/20 font-semibold" href="#"><el-icon><List /></el-icon>对象列表</a>
      </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="h-16 bg-white border-b shadow-sm px-6 flex items-center justify-between shrink-0">
        <div class="flex items-center text-gray-500 text-sm">
          <el-icon class="mr-2"><HomeFilled /></el-icon>
          <span>首页</span><span class="mx-2">/</span><span class="text-gray-800 font-bold">对象管理</span>
        </div>
        <el-dropdown trigger="click">
          <div class="flex items-center cursor-pointer pl-2">
            <el-avatar :size="32" src="https://cube.elemecdn.com/3/7c/3ea6beec64369c2642b92c6726f1epng.png"></el-avatar>
            <span class="ml-2 text-sm font-medium text-gray-700">Admin</span>
          </div>
          <template #dropdown>
            <el-dropdown-menu>
              <el-dropdown-item><a href="login.html" class="block w-full">退出登录</a></el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
      </header>

      <main class="flex-1 overflow-auto p-6">
        <section class="flex items-end justify-between gap-4 mb-6">
          <div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">对象管理</h1>
            <p class="text-gray-500 text-sm mt-1">适合列表内新增、编辑、辅助管理和导入导出。</p>
          </div>
          <div class="flex gap-3">
            <el-button plain @click="importVisible = true">导入</el-button>
            <el-button type="primary" color="#00689E" @click="openMainDialog(false)"><el-icon class="mr-1"><Plus /></el-icon>新增对象</el-button>
          </div>
        </section>

        <section class="panel overflow-hidden">
          <div class="p-4 bg-gray-50 border-b flex gap-3">
            <el-input placeholder="搜索名称/编号" prefix-icon="Search" style="width: 220px" />
            <el-select placeholder="状态" style="width: 140px">
              <el-option label="启用" value="active" />
              <el-option label="停用" value="inactive" />
            </el-select>
          </div>
          <div class="w-full">
            <el-table :data="rows" stripe table-layout="fixed" style="width: 100%">
              <el-table-column prop="name" label="名称" min-width="200"></el-table-column>
              <el-table-column prop="type" label="类型" width="140"></el-table-column>
              <el-table-column prop="status" label="状态" width="100">
                <template #default="{ row }"><el-tag :type="row.status === '启用' ? 'success' : 'info'" effect="plain">{{ row.status }}</el-tag></template>
              </el-table-column>
              <el-table-column prop="updatedAt" label="更新时间" width="160"></el-table-column>
              <el-table-column label="操作" width="150" align="right">
                <template #default="{ row }">
                  <el-button link type="primary" @click="openMainDialog(true, row)">编辑</el-button>
                  <el-button link type="primary" @click="detailVisible = true">详情</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>
        </section>
      </main>
    </div>

    <el-dialog v-model="mainVisible" :title="isEdit ? '编辑对象' : '新增对象'" width="920px" top="4vh" destroy-on-close>
      <el-form :model="form" label-position="top">
        <div class="text-sm font-semibold text-gray-800 mb-3">基础信息</div>
        <div class="grid grid-cols-2 gap-4 mb-5">
          <el-form-item label="名称" required><el-input v-model="form.name" placeholder="请输入" /></el-form-item>
          <el-form-item label="类型" required><el-select v-model="form.type" class="w-full" placeholder="请选择" /></el-form-item>
          <el-form-item label="归属对象" required>
            <div class="flex w-full gap-2">
              <el-select class="flex-1" placeholder="请选择" />
              <el-button plain @click="managerVisible = true">管理</el-button>
            </div>
          </el-form-item>
          <el-form-item label="启用状态"><el-switch v-model="form.enabled" active-text="启用" inactive-text="停用" /></el-form-item>
        </div>

        <div class="text-sm font-semibold text-gray-800 mb-3">位置/附件/能力</div>
        <div class="grid grid-cols-2 gap-4">
          <el-form-item label="地址">
            <div class="flex w-full gap-2">
              <el-input placeholder="请输入地址" />
              <el-button plain @click="mapVisible = true">地图选点</el-button>
            </div>
          </el-form-item>
          <el-form-item label="图片/附件"><el-upload drag action="#"><el-icon><UploadFilled /></el-icon><div>拖拽或点击上传</div></el-upload></el-form-item>
          <el-form-item label="服务能力" class="col-span-2">
            <el-checkbox-group v-model="form.services" class="grid grid-cols-3 gap-3">
              <el-checkbox label="能力 A" border />
              <el-checkbox label="能力 B" border />
              <el-checkbox label="能力 C" border />
            </el-checkbox-group>
          </el-form-item>
          <el-form-item label="备注" class="col-span-2"><el-input type="textarea" :rows="3" placeholder="补充说明" /></el-form-item>
        </div>
      </el-form>
      <template #footer>
        <el-button @click="mainVisible = false">取消</el-button>
        <el-button type="primary" color="#00689E" @click="mainVisible = false">保存</el-button>
      </template>
    </el-dialog>

    <el-dialog v-model="managerVisible" title="辅助管理" width="640px" append-to-body destroy-on-close>
      <div class="flex gap-2 mb-4"><el-input placeholder="新增选项" /><el-button type="primary" color="#00689E">新增</el-button></div>
      <el-table :data="managerRows" size="small" table-layout="fixed" style="width: 100%">
        <el-table-column prop="name" label="名称"></el-table-column>
        <el-table-column label="操作" width="90" align="right"><template #default><el-button link type="primary">编辑</el-button></template></el-table-column>
      </el-table>
    </el-dialog>

    <el-dialog v-model="mapVisible" title="地图选点" width="860px" append-to-body destroy-on-close>
      <div class="h-80 rounded-xl bg-slate-100 border border-dashed border-slate-300 flex items-center justify-center text-sm text-slate-500">地图占位区</div>
      <template #footer><el-button @click="mapVisible = false">取消</el-button><el-button type="primary" color="#00689E" @click="mapVisible = false">写入坐标</el-button></template>
    </el-dialog>

    <el-dialog v-model="importVisible" title="导入数据" width="480px" destroy-on-close>
      <el-upload drag action="#"><el-icon><UploadFilled /></el-icon><div>拖拽文件到此处，或点击上传</div></el-upload>
    </el-dialog>
  </div>

  <script>
    const { createApp, reactive, ref } = Vue;
    const app = createApp({
      setup() {
        const mainVisible = ref(false);
        const managerVisible = ref(false);
        const mapVisible = ref(false);
        const importVisible = ref(false);
        const detailVisible = ref(false);
        const isEdit = ref(false);
        const form = reactive({ name: '', type: '', enabled: true, services: [] });
        const rows = ref([
          { name: '示例对象 A', type: '类型 A', status: '启用', updatedAt: '2026-06-29 10:30' },
          { name: '示例对象 B', type: '类型 B', status: '停用', updatedAt: '2026-06-28 16:20' }
        ]);
        const managerRows = ref([{ name: '选项 A' }, { name: '选项 B' }]);
        const openMainDialog = (edit, row) => {
          isEdit.value = edit;
          form.name = row?.name || '';
          form.type = row?.type || '';
          mainVisible.value = true;
        };
        return { mainVisible, managerVisible, mapVisible, importVisible, detailVisible, isEdit, form, rows, managerRows, openMainDialog };
      }
    });
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) app.component(key, component);
    app.use(ElementPlus).mount('#app');
  </script>
</body>
</html>
