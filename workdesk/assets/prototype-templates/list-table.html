<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkDesk List Table Template</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.8.0/dist/index.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.8.0/dist/index.full.js"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <style>
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; }
    .brand-bg { background: #00689E; }
    .panel { border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgb(15 23 42 / 0.05); }
  </style>
</head>
<body>
  <div id="app" class="h-screen flex overflow-hidden">
    <aside class="w-64 shrink-0 brand-bg text-white flex flex-col">
      <div class="h-16 px-5 flex items-center border-b border-white/10 font-semibold">列表表格母版</div>
      <nav class="flex-1 px-3 py-5 text-sm space-y-1">
        <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-white/20 font-semibold" href="#"><el-icon><List /></el-icon>对象列表</a>
        <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10" href="#"><el-icon><Setting /></el-icon>配置管理</a>
      </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="h-16 bg-white border-b shadow-sm px-6 flex items-center justify-between shrink-0">
        <div class="flex items-center text-gray-500 text-sm">
          <el-icon class="mr-2"><HomeFilled /></el-icon>
          <span>首页</span><span class="mx-2">/</span><span>对象管理</span><span class="mx-2">/</span><span class="text-gray-800 font-bold">对象列表</span>
        </div>
        <el-dropdown trigger="click">
          <div class="flex items-center cursor-pointer pl-2">
            <el-avatar :size="32" src="https://cube.elemecdn.com/3/7c/3ea6beec64369c2642b92c6726f1epng.png"></el-avatar>
            <span class="ml-2 text-sm font-medium text-gray-700">Admin</span>
          </div>
          <template #dropdown>
            <el-dropdown-menu>
              <el-dropdown-item><a href="login.html" class="block w-full">退出登录</a></el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
      </header>

      <main class="flex-1 overflow-auto p-6">
        <section class="flex justify-between items-end gap-4 mb-6">
          <div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">对象列表</h1>
            <p class="text-gray-500 text-sm mt-1">摘要卡可作为快速筛选入口。</p>
          </div>
          <div class="flex gap-3 shrink-0">
            <el-button plain>导出</el-button>
            <el-button type="primary" color="#00689E" @click="dialogVisible = true"><el-icon class="mr-1"><Plus /></el-icon>新增对象</el-button>
          </div>
        </section>

        <section class="grid grid-cols-4 gap-4 mb-5">
          <button v-for="card in summary" :key="card.key" class="panel p-4 text-left hover:border-[#00689E] transition-colors" :class="activeQuick === card.key ? 'border-[#00689E] ring-1 ring-[#00689E]' : ''" @click="activeQuick = card.key">
            <div class="text-xs text-gray-500">{{ card.label }}</div>
            <div class="mt-2 text-2xl font-semibold text-gray-900">{{ card.value }}</div>
            <div class="mt-1 text-xs text-gray-500">{{ card.note }}</div>
          </button>
        </section>

        <section class="panel overflow-hidden">
          <div class="p-4 border-b bg-gray-50 flex flex-wrap items-center gap-3">
            <el-input v-model="filters.keyword" placeholder="搜索名称/编号" prefix-icon="Search" clearable style="width: 180px" />
            <el-select v-model="filters.status" placeholder="状态" clearable style="width: 140px">
              <el-option label="启用" value="active" />
              <el-option label="停用" value="inactive" />
              <el-option label="异常" value="warning" />
            </el-select>
            <el-date-picker v-model="filters.date" type="daterange" start-placeholder="开始日期" end-placeholder="结束日期" style="width: 260px" />
            <div class="flex-1"></div>
            <el-button plain :disabled="selectedRows.length === 0">批量操作</el-button>
            <el-button plain @click="resetFilters">重置</el-button>
          </div>

          <div class="w-full">
            <el-table :data="filteredRows" stripe style="width: 100%" table-layout="fixed" @selection-change="selectedRows = $event" :header-cell-style="{ backgroundColor: '#f9fafb', color: '#374151', fontWeight: 600 }">
              <el-table-column type="selection" width="48"></el-table-column>
              <el-table-column prop="code" label="编号" width="120"></el-table-column>
              <el-table-column label="对象信息" min-width="220">
                <template #default="{ row }">
                  <div class="font-medium text-gray-900">{{ row.name }}</div>
                  <div class="text-xs text-gray-500 mt-1">{{ row.desc }}</div>
                </template>
              </el-table-column>
              <el-table-column prop="owner" label="负责人" width="120"></el-table-column>
              <el-table-column label="状态" width="110">
                <template #default="{ row }">
                  <el-tag :type="statusType(row.status)" effect="plain">{{ statusText(row.status) }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column prop="updatedAt" label="更新时间" width="160"></el-table-column>
              <el-table-column label="操作" width="140" align="right">
                <template #default="{ row }">
                  <el-button link type="primary" @click="openDetail(row)">查看</el-button>
                  <el-button link type="primary" @click="dialogVisible = true">编辑</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>
          <div class="p-4 border-t bg-gray-50 flex justify-end">
            <el-pagination layout="prev, pager, next" :total="80" />
          </div>
        </section>
      </main>
    </div>

    <el-dialog v-model="dialogVisible" title="新增/编辑对象" width="640px" destroy-on-close>
      <el-form label-position="top">
        <div class="grid grid-cols-2 gap-4">
          <el-form-item label="对象名称" required><el-input placeholder="请输入" /></el-form-item>
          <el-form-item label="对象类型" required><el-select class="w-full" placeholder="请选择" /></el-form-item>
          <el-form-item label="负责人"><el-input placeholder="请输入" /></el-form-item>
          <el-form-item label="状态"><el-switch active-text="启用" inactive-text="停用" /></el-form-item>
        </div>
      </el-form>
      <template #footer>
        <el-button @click="dialogVisible = false">取消</el-button>
        <el-button type="primary" color="#00689E" @click="dialogVisible = false">保存</el-button>
      </template>
    </el-dialog>
  </div>

  <script>
    const { createApp, ref, reactive, computed } = Vue;
    const app = createApp({
      setup() {
        const activeQuick = ref('all');
        const dialogVisible = ref(false);
        const selectedRows = ref([]);
        const filters = reactive({ keyword: '', status: '', date: null });
        const summary = ref([
          { key: 'all', label: '全部', value: 80, note: '当前筛选总量' },
          { key: 'active', label: '启用', value: 62, note: '可正常使用' },
          { key: 'warning', label: '异常', value: 5, note: '需要处理' },
          { key: 'inactive', label: '停用', value: 13, note: '暂不生效' }
        ]);
        const rows = ref([
          { code: 'OBJ-001', name: '示例对象 A', desc: '用于展示主信息和辅助说明', owner: '负责人 A', status: 'active', updatedAt: '2026-06-29 10:30' },
          { code: 'OBJ-002', name: '示例对象 B', desc: '含异常状态，需要提示处理', owner: '负责人 B', status: 'warning', updatedAt: '2026-06-28 16:20' },
          { code: 'OBJ-003', name: '示例对象 C', desc: '停用但保留历史记录', owner: '负责人 C', status: 'inactive', updatedAt: '2026-06-27 09:15' }
        ]);
        const filteredRows = computed(() => rows.value.filter(row => {
          if (activeQuick.value !== 'all' && row.status !== activeQuick.value) return false;
          if (filters.status && row.status !== filters.status) return false;
          if (filters.keyword && !`${row.code}${row.name}`.includes(filters.keyword)) return false;
          return true;
        }));
        const resetFilters = () => { filters.keyword = ''; filters.status = ''; filters.date = null; activeQuick.value = 'all'; };
        const statusType = status => ({ active: 'success', warning: 'warning', inactive: 'info' }[status] || 'info');
        const statusText = status => ({ active: '启用', warning: '异常', inactive: '停用' }[status] || status);
        const openDetail = row => ElementPlus.ElMessage.info(`查看 ${row.name}`);
        return { activeQuick, dialogVisible, selectedRows, filters, summary, filteredRows, resetFilters, statusType, statusText, openDetail };
      }
    });
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) app.component(key, component);
    app.use(ElementPlus).mount('#app');
  </script>
</body>
</html>
